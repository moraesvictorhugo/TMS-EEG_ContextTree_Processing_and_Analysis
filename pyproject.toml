[project]
name = "tms-eeg-contexttree-processing-and-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edfio>=0.4.13",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matlabengine==24.2.*",
    "matplotlib>=3.10.8",
    "mne>=1.11.0",
    "mne-qt-browser>=0.7.4",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pyqt5>=5.15.11",
    "pytep-sound-sspsir==0.1.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "scipy-stubs>=1.17.1.5",
    "seaborn>=0.13.2",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["tms_eeg"]

